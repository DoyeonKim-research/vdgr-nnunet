[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vdgr-nnunet"
version = "0.1.0"
description = "Reference implementation of VDGR-nnU-Net"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  {name = "Doyeon Kim", email = "doyeonkim.research@gmail.com"},
  {name = "Jinsul Kim", email = "jsworld@jnu.ac.kr"},
]
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.2",
  "scipy==1.13.1",
  "SimpleITK==2.5.0",
  "scikit-image==0.26.0",
  "nnunetv2==2.6.2",
]

[project.optional-dependencies]
test = ["pytest>=8.2,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
